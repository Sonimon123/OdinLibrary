<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button command="show-modal" commandfor="my-dialog">Add Book</button>
    <dialog id="my-dialog">
        <form id="myForm">
            <label for="title">Title: </label>
            <input type="text" id="title" name="title" required><br>
            <label for="author">Author: </label>
            <input type="text" id="author" name="author" required><br>
            <label for="pages">Page Count: </label>
            <input type="number" id="pages" name="pages" required><br>
            <label for="read">Read</label>
            <input type="radio" id="read" name="read_bool" value=true required>
            <label for="read">Unread</label>
            <input type="radio" id="unread" name="read_bool" value=false required><br>
            <input type="submit" value="Submit">
        </form>
        <button commandfor="my-dialog" command="close">Close</button>
    </dialog>
    <div class="library">

    </div>
</body>
<script src="Book.js"></script>
</html>
